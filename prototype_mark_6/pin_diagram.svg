<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="920" viewBox="0 0 1300 920" font-family="Helvetica, Arial, sans-serif">
  <rect width="1300" height="920" fill="#ffffff"/>
  <text x="650" y="38" text-anchor="middle" font-size="26" font-weight="bold">LaserTag Mark 6 - Wiring Diagram (ESP32 30-Pin Board)</text>
  <text x="650" y="64" text-anchor="middle" font-size="14" fill="#475569">Pins labeled exactly as printed on your board silkscreen: D13, D12... row (Left) and D15, D2, D4... row (Right)</text>

  <!-- ================= CENTER: ESP32 30-PIN CHIP ================= -->
  <rect x="500" y="90" width="300" height="780" rx="16" fill="#0f172a" stroke="#000" stroke-width="3"/>
  <rect x="580" y="105" width="140" height="90" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
  <text x="650" y="155" text-anchor="middle" font-size="15" fill="#e2e8f0" font-weight="bold">ESP-WROOM-32</text>

  <rect x="610" y="830" width="80" height="40" rx="4" fill="#64748b" stroke="#000" stroke-width="2"/>
  <text x="650" y="855" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">Micro-USB</text>

  <!-- Header Titles on Board -->
  <text x="525" y="225" font-size="11" fill="#94a3b8" font-weight="bold">LEFT ROW</text>
  <text x="525" y="240" font-size="10" fill="#64748b">(D13, D12...)</text>
  <text x="775" y="225" text-anchor="end" font-size="11" fill="#94a3b8" font-weight="bold">RIGHT ROW</text>
  <text x="775" y="240" text-anchor="end" font-size="10" fill="#64748b">(D15, D2...)</text>

  <!-- Left Header Pins (Top to Bottom: EN, VP, VN, D34, D35, D32, D33, D25, D26, D27, D14, D12, D13, GND, VIN) -->
  <!-- Pin Y spacing: y0 = 260, step = 38 -->
  <!-- Active left pins: D32 (y=450), D33 (y=488), D13 (y=716), GND (y=754), VIN (y=792) -->

  <!-- Left inactives -->
  <g font-size="12" fill="#64748b">
    <text x="520" y="264">EN</text>
    <text x="520" y="302">VP</text>
    <text x="520" y="340">VN</text>
    <text x="520" y="378">D34</text>
    <text x="520" y="416">D35</text>
    <text x="520" y="530">D25</text>
    <text x="520" y="568">D26</text>
    <text x="520" y="606">D27</text>
    <text x="520" y="644">D14</text>
    <text x="520" y="682">D12</text>
  </g>

  <!-- Left Active Pins with badges -->
  <g font-size="13" font-weight="bold">
    <!-- D32 -->
    <rect x="502" y="434" width="70" height="26" rx="4" fill="#15803d"/>
    <text x="515" y="452" fill="#ffffff">D32</text>
    <circle cx="500" cy="447" r="7" fill="#22c55e" stroke="#000" stroke-width="2"/>

    <!-- D33 -->
    <rect x="502" y="472" width="70" height="26" rx="4" fill="#7e22ce"/>
    <text x="515" y="490" fill="#ffffff">D33</text>
    <circle cx="500" cy="485" r="7" fill="#a855f7" stroke="#000" stroke-width="2"/>

    <!-- D13 -->
    <rect x="502" y="700" width="70" height="26" rx="4" fill="#b91c1c"/>
    <text x="515" y="718" fill="#ffffff">D13</text>
    <circle cx="500" cy="713" r="7" fill="#ef4444" stroke="#000" stroke-width="2"/>

    <!-- GND -->
    <rect x="502" y="738" width="70" height="26" rx="4" fill="#334155"/>
    <text x="515" y="756" fill="#ffffff">GND</text>
    <circle cx="500" cy="751" r="7" fill="#000000" stroke="#fff" stroke-width="2"/>

    <!-- VIN -->
    <rect x="502" y="776" width="70" height="26" rx="4" fill="#c2410c"/>
    <text x="515" y="794" fill="#ffffff">VIN</text>
    <circle cx="500" cy="789" r="7" fill="#ea580c" stroke="#000" stroke-width="2"/>
  </g>

  <!-- Right Header Pins (Top to Bottom: D23, D22, TX, RX, D21, D19, D18, D5, D17, D16, D4, D0, D2, D15, 3V3) -->
  <!-- Active right pins: D22 (y=298), D21 (y=412), D4 (y=640), D15 (y=754), 3V3 (y=792) -->

  <!-- Right inactives -->
  <g font-size="12" fill="#64748b" text-anchor="end">
    <text x="780" y="264">D23</text>
    <text x="780" y="340">TX</text>
    <text x="780" y="378">RX</text>
    <text x="780" y="450">D19</text>
    <text x="780" y="488">D18</text>
    <text x="780" y="526">D5</text>
    <text x="780" y="564">D17</text>
    <text x="780" y="602">D16</text>
    <text x="780" y="678">D0</text>
    <text x="780" y="716">D2 (LED)</text>
  </g>

  <!-- Right Active Pins with badges -->
  <g font-size="13" font-weight="bold">
    <!-- D22 -->
    <rect x="728" y="285" width="70" height="26" rx="4" fill="#0284c7"/>
    <text x="785" y="303" text-anchor="end" fill="#ffffff">D22</text>
    <circle cx="800" cy="298" r="7" fill="#38bdf8" stroke="#000" stroke-width="2"/>

    <!-- D21 -->
    <rect x="728" y="399" width="70" height="26" rx="4" fill="#0284c7"/>
    <text x="785" y="417" text-anchor="end" fill="#ffffff">D21</text>
    <circle cx="800" cy="412" r="7" fill="#38bdf8" stroke="#000" stroke-width="2"/>

    <!-- D4 -->
    <rect x="728" y="627" width="70" height="26" rx="4" fill="#d97706"/>
    <text x="785" y="645" text-anchor="end" fill="#ffffff">D4</text>
    <circle cx="800" cy="640" r="7" fill="#f59e0b" stroke="#000" stroke-width="2"/>

    <!-- D15 -->
    <rect x="728" y="741" width="70" height="26" rx="4" fill="#2563eb"/>
    <text x="785" y="759" text-anchor="end" fill="#ffffff">D15</text>
    <circle cx="800" cy="754" r="7" fill="#3b82f6" stroke="#000" stroke-width="2"/>

    <!-- 3V3 -->
    <rect x="728" y="779" width="70" height="26" rx="4" fill="#dc2626"/>
    <text x="785" y="797" text-anchor="end" fill="#ffffff">3V3</text>
    <circle cx="800" cy="792" r="7" fill="#ef4444" stroke="#000" stroke-width="2"/>
  </g>

  <!-- ================= LEFT SIDE: GUN BUTTONS & BUZZER ================= -->
  <!-- Green Trigger (Friend Shot) -->
  <rect x="40" y="380" width="360" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="408" font-size="16" font-weight="bold" fill="#15803d">GREEN Trigger Button (Medic/Friend Shot)</text>
  <text x="60" y="432" font-size="13">Leg 1 -> Board Pin <tspan font-weight="bold" fill="#15803d">D32</tspan></text>
  <text x="60" y="452" font-size="13">Leg 2 (Diagonal) -> Board Pin <tspan font-weight="bold">GND</tspan></text>
  <polyline points="400,425 450,425 450,447 500,447" fill="none" stroke="#16a34a" stroke-width="3"/>

  <!-- Passive Buzzer -->
  <rect x="40" y="490" width="360" height="90" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="60" y="518" font-size="16" font-weight="bold" fill="#7e22ce">Passive Buzzer (Sound / Melodies)</text>
  <text x="60" y="542" font-size="13">Pin (+) -> Board Pin <tspan font-weight="bold" fill="#7e22ce">D33</tspan></text>
  <text x="60" y="562" font-size="13">Pin (-) -> Board Pin <tspan font-weight="bold">GND</tspan></text>
  <polyline points="400,535 440,535 440,485 500,485" fill="none" stroke="#9333ea" stroke-width="3"/>

  <!-- Red Trigger (Enemy Shot) -->
  <rect x="40" y="650" width="360" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="678" font-size="16" font-weight="bold" fill="#b91c1c">RED Trigger Button (Enemy Shot)</text>
  <text x="60" y="702" font-size="13">Leg 1 -> Board Pin <tspan font-weight="bold" fill="#b91c1c">D13</tspan></text>
  <text x="60" y="722" font-size="13">Leg 2 (Diagonal) -> Board Pin <tspan font-weight="bold">GND</tspan></text>
  <polyline points="400,695 440,695 440,713 500,713" fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- Shared Ground Rail on Left -->
  <line x1="400" y1="751" x2="500" y2="751" stroke="#000" stroke-width="4"/>
  <text x="390" y="756" text-anchor="end" font-size="13" font-weight="bold">Common GND Bus</text>

  <!-- ================= RIGHT SIDE: LCD, IR LED, TSOP SENSORS ================= -->
  <!-- 16x2 LCD Display -->
  <rect x="900" y="260" width="360" height="170" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="920" y="288" font-size="16" font-weight="bold" fill="#0369a1">16x2 LCD Display (I2C Backpack)</text>
  <text x="920" y="315" font-size="13">SCL Pin -> Board Pin <tspan font-weight="bold" fill="#0284c7">D22</tspan></text>
  <text x="920" y="340" font-size="13">SDA Pin -> Board Pin <tspan font-weight="bold" fill="#0284c7">D21</tspan></text>
  <text x="920" y="365" font-size="13">VCC Pin -> Board Pin <tspan font-weight="bold" fill="#ea580c">VIN</tspan> (5V Power from USB)</text>
  <text x="920" y="390" font-size="13">GND Pin -> Board Pin <tspan font-weight="bold">GND</tspan></text>
  <text x="920" y="415" font-size="11" fill="#64748b">Adjust blue contrast screw on back if blank</text>
  <!-- LCD wires to ESP32 -->
  <polyline points="900,310 840,310 840,298 800,298" fill="none" stroke="#0284c7" stroke-width="3"/>
  <polyline points="900,335 850,335 850,412 800,412" fill="none" stroke="#0284c7" stroke-width="3"/>
  <!-- VIN line across bottom -->
  <polyline points="900,360 880,360 880,820 480,820 480,789 500,789" fill="none" stroke="#ea580c" stroke-width="3"/>

  <!-- Gun IR LED -->
  <rect x="900" y="560" width="360" height="120" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="920" y="588" font-size="16" font-weight="bold" fill="#b45309">Gun IR LED (940nm Emitter)</text>
  <text x="920" y="614" font-size="13">Long Leg (+) -> <tspan font-weight="bold">100Ω Resistor</tspan> -> Board Pin <tspan font-weight="bold" fill="#d97706">D4</tspan></text>
  <text x="920" y="638" font-size="13">Short Leg (-) -> Board Pin <tspan font-weight="bold">GND</tspan></text>
  <text x="920" y="662" font-size="12" fill="#b45309">Recess 30mm inside black barrel tube</text>
  <polyline points="900,610 850,610 850,640 800,640" fill="none" stroke="#d97706" stroke-width="3"/>

  <!-- 6x TSOP Sensors -->
  <rect x="900" y="700" width="360" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="920" y="728" font-size="16" font-weight="bold" fill="#1d4ed8">6x TSOP1838 Sensors (Vest)</text>
  <text x="920" y="754" font-size="13">All 6 OUT Pins joined -> Board Pin <tspan font-weight="bold" fill="#2563eb">D15</tspan></text>
  <text x="920" y="778" font-size="13">All 6 VCC Pins joined -> Board Pin <tspan font-weight="bold" fill="#dc2626">3V3 ONLY</tspan></text>
  <text x="920" y="802" font-size="13">All 6 GND Pins joined -> Board Pin <tspan font-weight="bold">GND</tspan></text>
  <text x="920" y="828" font-size="12" fill="#b91c1c" font-weight="bold">Solder 0.1µF cap across VCC/GND at each sensor!</text>
  <polyline points="900,750 850,750 850,754 800,754" fill="none" stroke="#2563eb" stroke-width="3"/>
  <polyline points="900,774 860,774 860,792 800,792" fill="none" stroke="#dc2626" stroke-width="3"/>

</svg>